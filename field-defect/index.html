<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>现场缺陷展示</title>
    <link rel="stylesheet" href="../shared/app-switcher.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="../shared/app-switcher.js" defer></script>
    <script src="./core.js" defer></script>
    <script src="./project-store.js" defer></script>
    <script src="./project-repository.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body data-app="field-defect">
    <header class="fd-topbar">
      <div class="fd-brand">
        <label class="app-switcher">
          <span class="sr-only">应用</span>
          <select id="appSwitcher" aria-label="选择应用">
            <option value="viewer">数据可视化工具</option>
            <option value="field-defect">现场缺陷展示</option>
          </select>
        </label>
      </div>
      <div class="fd-toolbar">
        <button id="newProjectBtn" type="button">新建工程</button>
        <button id="rescanBtn" type="button" disabled>重新扫描</button>
        <button id="importExcelBtn" type="button" disabled>导入 Excel 图片</button>
        <button id="importOriginalDefectsBtn" type="button" disabled>上传原始缺陷</button>
        <details id="originalDefectsMenu" class="toolbar-menu">
          <summary id="originalDefectsSummary">原始缺陷（0）</summary>
          <div id="originalDefectsList" class="toolbar-menu-panel"></div>
        </details>
        <button id="reconnectBtn" type="button" disabled>重新授权</button>
      </div>
    </header>

    <main class="fd-layout">
      <aside class="fd-project-rail panelish">
        <div class="section-heading project-history-heading">
          <strong>历史工程 <span id="projectCount">0</span></strong>
          <select id="historySort" aria-label="历史工程排序">
            <option value="created-desc">创建：新到旧</option>
            <option value="created-asc">创建：旧到新</option>
            <option value="name-asc">名称：升序</option>
            <option value="name-desc">名称：降序</option>
          </select>
        </div>
        <div id="projectList" class="project-list"></div>
        <div id="historyEmpty" class="empty-copy">还没有工程，请先新建。</div>
      </aside>

      <section class="fd-workspace">
        <div class="fd-project-header panelish">
          <div class="project-summary">
            <div class="project-identity">
              <div class="eyebrow">当前工程</div>
              <h1 id="projectName">未选择工程</h1>
              <p id="projectPath">选择一个工程文件夹开始。</p>
            </div>
            <div class="project-stats" aria-label="工程总信息">
              <span><b id="imageCount">0</b> 图片</span>
              <span><b id="defectCount">0</b> 缺陷</span>
            </div>
          </div>
          <div class="filter-stats" aria-live="polite">
            <div class="eyebrow">筛选结果</div>
            <div class="filter-stats-value"><b id="filteredImageCount">0</b><span>张图片</span></div>
          </div>
        </div>

        <div class="fd-content-grid">
          <section class="fd-images-panel panelish">
            <div class="section-heading">
              <strong>图片</strong>
              <div class="heading-actions">
                <input id="imageSearch" type="search" placeholder="筛选图片路径" aria-label="筛选图片路径" />
                <details id="defectFilterMenu" class="filter-menu">
                  <summary id="defectFilterText">全部缺陷</summary>
                  <div id="defectFilterOptions" class="filter-options"></div>
                </details>
                <select id="imageSort" aria-label="图片排序">
                  <option value="original">原始顺序</option>
                  <option value="defect-asc">缺陷名升序</option>
                  <option value="defect-desc">缺陷名降序</option>
                </select>
                <button id="configureDefectsBtn" type="button" disabled>缺陷配置</button>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <colgroup>
                  <col class="image-column" />
                  <col class="pole-column" />
                  <col class="defect-column" />
                  <col class="remark-column" />
                  <col class="action-column" />
                </colgroup>
                <thead>
                  <tr><th class="image-column">图片</th><th class="pole-column">杆号</th><th class="defect-column">缺陷名</th><th class="remark-column">备注</th><th class="action-column">操作</th></tr>
                </thead>
                <tbody id="imageTableBody"></tbody>
              </table>
              <div id="imageEmpty" class="empty-copy">当前工程没有图片。可以扫描目录或导入 Excel 图片。</div>
            </div>
          </section>

          <aside class="fd-defects-panel panelish">
            <div class="section-heading"><strong>工程缺陷</strong><button id="addDefectBtn" type="button" disabled>添加</button></div>
            <div id="defectList" class="defect-list"></div>
            <div id="defectEmpty" class="empty-copy">还没有配置缺陷。</div>
          </aside>
        </div>
      </section>
    </main>

    <div id="projectDialog" class="dialog-backdrop" hidden>
      <form id="projectForm" class="dialog" method="dialog">
        <div class="dialog-heading"><h2>新建工程</h2><button type="button" data-close-dialog="projectDialog" aria-label="关闭">×</button></div>
        <label>工程名称<input id="projectNameInput" name="projectName" required maxlength="80" placeholder="例如：2026年春检缺陷整理" /></label>
        <div class="folder-picker-row"><button id="chooseFolderBtn" type="button">选择工程文件夹</button><span id="chosenFolderText">尚未选择</span></div>
        <p class="dialog-note">将递归扫描所选文件夹中的 JPG、JPEG、PNG、BMP、WEBP。文件夹可以为空。</p>
        <div class="dialog-actions"><button type="button" data-close-dialog="projectDialog">取消</button><button type="submit" class="primary">创建工程</button></div>
      </form>
    </div>

    <div id="defectDialog" class="dialog-backdrop" hidden>
      <form id="defectForm" class="dialog" method="dialog">
        <div class="dialog-heading"><h2>添加缺陷</h2><button type="button" data-close-dialog="defectDialog" aria-label="关闭">×</button></div>
        <label>缺陷名<input id="defectNameInput" required maxlength="80" placeholder="例如：螺栓缺失" /></label>
        <div class="dialog-actions"><button type="button" data-close-dialog="defectDialog">取消</button><button type="submit" class="primary">保存</button></div>
      </form>
    </div>

    <div id="imageModal" class="image-modal" hidden>
      <section class="image-modal-dialog" role="dialog" aria-modal="true" aria-label="图片详情">
        <button id="closeImageModal" class="modal-close" type="button" aria-label="关闭预览">×</button>
        <div class="image-preview-pane">
          <button id="prevImageBtn" class="modal-nav prev" type="button" aria-label="上一张">‹</button>
          <div id="comparisonGrid" class="comparison-grid" aria-label="图片对比区"></div>
          <button id="nextImageBtn" class="modal-nav next" type="button" aria-label="下一张">›</button>
        </div>
        <div class="modal-info-pane">
          <div class="modal-meta-row">
            <div class="modal-sequence"><span>图片序号</span><strong id="modalSequence">-</strong></div>
            <label class="modal-edit-field"><span>杆号</span><input id="modalPoleNumber" maxlength="100" placeholder="填写杆号" /></label>
            <div class="modal-readonly-field"><span>图片来源</span><output id="modalSource">-</output></div>
            <button id="addVehicleCameraBtn" type="button" title="也可以按 Ctrl+V 粘贴剪贴板图片">添加车载相机成像</button>
            <span id="modalSaveStatus" class="modal-save-status" aria-live="polite">勾选后自动保存</span>
          </div>
          <div class="modal-defect-section">
            <strong>缺陷名</strong>
            <div id="modalDefectOptions" class="modal-defect-options"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="progressToast" class="progress-toast" hidden>
      <div id="progressMessage">准备中</div><progress id="progressBar" max="100" value="0"></progress>
    </div>
  </body>
</html>
